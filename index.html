<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build the Christmas Tree – True / False Quiz</title>
<style>
:root{
  --bg:#0f2433; --bg2:#173449; --card:#1c3d55; --ink:#f4f7fa; --muted:#a9bccb;
  --gold:#f5c04a; --green:#3fae6a; --red:#e2554f; --line:#2e5672;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color:var(--ink); background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));
  display:flex; justify-content:center; padding:16px; line-height:1.5;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:880px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,4.5vw,2.4rem);margin:8px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 16px}
.screen{display:none}.screen.show{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
input[type=text]{
  width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;
  border:2px solid var(--line);background:var(--bg);color:var(--ink);margin:10px 0 14px
}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:14px 20px;font-weight:700}
.primary{background:var(--gold);color:#2a1d00;width:100%;font-size:1.05rem}
.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:#ffb3ae;min-height:1.3em;margin:0 0 6px}
.game{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:720px){.game{grid-template-columns:300px 1fr;align-items:start}}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stat b{color:var(--gold)}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.qtext{font-size:1.25rem;min-height:4.5em;margin:4px 0 16px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf button{font-size:1.2rem;padding:18px;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.tf button:hover:not(:disabled){border-color:var(--gold)}
.tf button.right{background:var(--green);border-color:var(--green);color:#052914}
.tf button.wrong{background:var(--red);border-color:var(--red);color:#2d0705}
.tf button:disabled{cursor:default}
.fb{min-height:3.2em;margin:14px 0 8px;font-weight:700}
.fb.ok{color:#8be0ac}.fb.no{color:#ffb3ae}
.slots{display:flex;gap:6px;margin-top:12px}
.slots span{flex:1;height:8px;border-radius:4px;background:var(--bg)}
.slots .ok{background:var(--green)}.slots .no{background:var(--red)}
.treebox{background:var(--bg);border-radius:14px;padding:8px;border:1px solid var(--line)}
svg{width:100%;height:auto;display:block;max-height:60vh}
.piece{opacity:.12;transform-box:fill-box;transform-origin:center;transform:scale(.85);transition:opacity .5s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.piece.on{opacity:1;transform:scale(1)}
.result{text-align:center}
.result h2{font-family:Georgia,serif;font-size:2rem;margin:6px 0}
.result.win h2{color:var(--gold)}
.big{font-size:3rem;font-weight:700;margin:0}
.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);width:100%;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main class="app">
  <h1>🎄 Build the Christmas Tree</h1>
  <p class="sub">Answer True or False. Every correct answer adds one piece to the tree.</p>

  <!-- Name screen -->
  <section id="s-name" class="screen show">
    <div class="card">
      <label for="pname"><b>Your name</b></label>
      <input id="pname" type="text" maxlength="30" placeholder="Type your name here" autocomplete="off">
      <p class="err" id="nerr"></p>
      <button class="primary" id="start">Start game</button>
      <p class="sub" style="margin-top:14px">10 questions · 10 tree pieces · You must get 10/10 to win.</p>
    </div>
  </section>

  <!-- Game screen -->
  <section id="s-game" class="screen">
    <div class="game">
      <div class="treebox" aria-label="Your Christmas tree">
        <svg viewBox="0 0 300 400" role="img" aria-label="Christmas tree being built">
          <!-- 1 trunk -->
          <g class="piece" id="p0"><rect x="127" y="335" width="46" height="48" rx="4" fill="#8a5a33"/><rect x="127" y="335" width="12" height="48" rx="4" fill="#6e4524"/></g>
          <!-- 2-5 tiers -->
          <g class="piece" id="p1"><polygon points="150,215 30,340 270,340" fill="#1f7a46"/></g>
          <g class="piece" id="p2"><polygon points="150,150 50,255 250,255" fill="#26995a"/></g>
          <g class="piece" id="p3"><polygon points="150,95 72,180 228,180" fill="#2fb26a"/></g>
          <g class="piece" id="p4"><polygon points="150,52 95,122 205,122" fill="#3dc77a"/></g>
          <!-- 6 garland -->
          <g class="piece" id="p5"><path d="M70 300 Q150 330 230 300 M88 232 Q150 258 212 232 M108 163 Q150 182 192 163" fill="none" stroke="#f5c04a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/></g>
          <!-- 7 lights -->
          <g class="piece" id="p6"><circle cx="105" cy="268" r="5" fill="#fff3a8"/><circle cx="195" cy="268" r="5" fill="#fff3a8"/><circle cx="150" cy="198" r="5" fill="#fff3a8"/><circle cx="128" cy="140" r="5" fill="#fff3a8"/><circle cx="172" cy="140" r="5" fill="#fff3a8"/><circle cx="150" cy="95" r="5" fill="#fff3a8"/></g>
          <!-- 8 ornaments -->
          <g class="piece" id="p7"><circle cx="85" cy="318" r="9" fill="#e2554f"/><circle cx="215" cy="318" r="9" fill="#4aa3e8"/><circle cx="150" cy="300" r="9" fill="#e2554f"/><circle cx="120" cy="236" r="8" fill="#4aa3e8"/><circle cx="180" cy="236" r="8" fill="#e2554f"/><circle cx="150" cy="168" r="7" fill="#4aa3e8"/></g>
          <!-- 9 gifts -->
          <g class="piece" id="p8"><rect x="38" y="352" width="42" height="34" fill="#e2554f"/><rect x="56" y="352" width="6" height="34" fill="#f5c04a"/><rect x="38" y="366" width="42" height="6" fill="#f5c04a"/><rect x="215" y="358" width="48" height="28" fill="#4aa3e8"/><rect x="236" y="358" width="6" height="28" fill="#fff"/></g>
          <!-- 10 star -->
          <g class="piece" id="p9"><polygon points="150,12 157,34 180,34 162,48 169,70 150,56 131,70 138,48 120,34 143,34" fill="#f5c04a"/></g>
        </svg>
      </div>

      <div class="card">
        <div class="stats">
          <span class="stat">Player: <b id="gname"></b></span>
          <span class="stat">Score: <b id="gscore">0</b> / 10</span>
          <span class="stat">Question <b id="gq">1</b> / 10</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" id="bar"><i id="barfill"></i></div>
        <p class="qtext" id="qtext" aria-live="polite"></p>
        <div class="tf">
          <button id="bT">True</button>
          <button id="bF">False</button>
        </div>
        <p class="fb" id="fb" aria-live="polite"></p>
        <button class="primary" id="next" style="display:none">Next question</button>
        <div class="slots" id="slots"></div>
      </div>
    </div>
  </section>

  <!-- Result screen -->
  <section id="s-end" class="screen">
    <div class="card result" id="rcard">
      <p class="big" id="rbig"></p>
      <h2 id="rtitle"></h2>
      <p id="rmsg"></p>
      <button class="primary" id="again">Play again</button>
      <button class="ghost" id="rename">Change player name</button>
    </div>
    <div class="treebox" style="margin-top:16px;max-width:320px;margin-inline:auto" id="endtree"></div>
  </section>
</main>

<script>
const QUESTIONS = [
  {q:"Bryan's organization is supporting the prisoners who could afford legal support.", a:false},
  {q:"Bryan founded a food delivery charity.", a:false},
  {q:"Robert's difficult childhood inspired him to make a difference.", a:true},
  {q:"Both of them believe helping others requires understanding their lives.", a:true},
  {q:"Both think donations alone can end poverty.", a:false},
  {q:"Robert volunteered at homeless shelters while at university.", a:true},
  {q:"Robert stayed in his finance career.", a:false},
  {q:"The text shows that leftovers from restaurants can feed the poor.", a:true},
  {q:"\u201CThe Equal Justice Initiative\u201D has rescued over 9 million kg of food.", a:false},
  {q:"Both stories show that helping others requires getting close to them.", a:true}
];
const $ = id => document.getElementById(id);
let name = "", idx = 0, score = 0, locked = false, results = [];

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  $(id).classList.add('show');
}

function resetTree(){
  document.querySelectorAll('.piece').forEach(p => p.classList.remove('on'));
}

function startGame(){
  idx = 0; score = 0; results = []; locked = false;
  resetTree();
  $('gname').textContent = name;
  $('slots').innerHTML = QUESTIONS.map(() => '<span></span>').join('');
  show('s-game');
  render();
}

function render(){
  locked = false;
  $('gq').textContent = idx + 1;
  $('gscore').textContent = score;
  $('qtext').textContent = (idx + 1) + ". " + QUESTIONS[idx].q;
  $('fb').textContent = ""; $('fb').className = "fb";
  $('next').style.display = "none";
  ['bT','bF'].forEach(b => { $(b).disabled = false; $(b).className = ""; });
  updateProgress();
}

function updateProgress(){
  $('barfill').style.width = (idx / QUESTIONS.length * 100) + "%";
  $('bar').setAttribute('aria-valuenow', idx);
}

function answer(val){
  if (locked) return;
  locked = true;
  const correct = QUESTIONS[idx].a;
  const ok = val === correct;
  $('bT').disabled = $('bF').disabled = true;
  $(correct ? 'bT' : 'bF').classList.add('right');
  if (!ok) $(val ? 'bT' : 'bF').classList.add('wrong');
  results.push(ok);
  $('slots').children[idx].className = ok ? 'ok' : 'no';
  if (ok){
    score++;
    $('p' + idx).classList.add('on');
    $('fb').textContent = "Correct! You earned tree piece " + (idx + 1) + " of 10.";
    $('fb').className = "fb ok";
  } else {
    $('fb').textContent = "Not quite. The correct answer is " + (correct ? "True" : "False") + ". No piece this time.";
    $('fb').className = "fb no";
  }
  $('gscore').textContent = score;
  $('barfill').style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  $('next').textContent = idx === QUESTIONS.length - 1 ? "See result" : "Next question";
  $('next').style.display = "block";
}

function nextQ(){
  idx++;
  if (idx >= QUESTIONS.length) return finish();
  render();
}

function finish(){
  const win = score === QUESTIONS.length;
  $('rcard').className = "card result" + (win ? " win" : "");
  $('rbig').textContent = score + " / 10";
  $('rtitle').textContent = win ? "\uD83C\uDFC6 " + name + " is the winner!" : "Good try, " + name + "!";
  $('rmsg').textContent = win
    ? "You completed the whole Christmas tree. Perfect score!"
    : "You built " + score + " of 10 pieces. You need 10/10 to win. Play again to finish the tree.";
  // copy current tree into the result screen
  const svg = document.querySelector('.game svg').cloneNode(true);
  $('endtree').innerHTML = ""; $('endtree').appendChild(svg);
  show('s-end');
  if (win) confetti();
}

// Events
$('start').onclick = () => {
  const v = $('pname').value.trim();
  if (!v){ $('nerr').textContent = "Please type your name to start."; $('pname').focus(); return; }
  name = v; $('nerr').textContent = ""; startGame();
};
$('pname').addEventListener('keydown', e => { if (e.key === 'Enter') $('start').click(); });
$('bT').onclick = () => answer(true);
$('bF').onclick = () => answer(false);
$('next').onclick = nextQ;
$('again').onclick = startGame;
$('rename').onclick = () => { $('pname').value = ""; show('s-name'); $('pname').focus(); };

// Snow background
const cv = $('snow'), cx = cv.getContext('2d');
let flakes = [];
function sizeSnow(){
  cv.width = innerWidth; cv.height = innerHeight;
  flakes = Array.from({length: Math.min(70, Math.floor(innerWidth / 14))}, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height,
    r: Math.random() * 2.4 + .8, v: Math.random() * .7 + .3
  }));
}
function snow(){
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.fillStyle = "rgba(255,255,255,.75)";
  flakes.forEach(f => {
    f.y += f.v; f.x += Math.sin(f.y / 40) * .3;
    if (f.y > cv.height) { f.y = -5; f.x = Math.random() * cv.width; }
    cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.3); cx.fill();
  });
  requestAnimationFrame(snow);
}
sizeSnow(); addEventListener('resize', sizeSnow);
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) snow();

// Simple confetti for winners
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ["#f5c04a","#e2554f","#4aa3e8","#3fae6a","#fff"];
  const bits = Array.from({length: 90}, () => ({
    x: Math.random() * cv.width, y: -10 - Math.random() * 200,
    c: cols[Math.floor(Math.random() * cols.length)], v: Math.random() * 3 + 2, s: Math.random() * 6 + 4
  }));
  let n = 0;
  (function loop(){
    cx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => { b.y += b.v; cx.fillStyle = b.c; cx.fillRect(b.x, b.y, b.s, b.s); });
    if (++n < 220) requestAnimationFrame(loop); else { sizeSnow(); snow(); }
  })();
}
</script>
</body>
</html>
